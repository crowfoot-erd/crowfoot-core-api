# JDBC 连接诊断
jdbc.timeout=连接超时 — 目标服务器可能响应缓慢或被防火墙拦截
jdbc.auth=认证失败 — 请检查用户名和密码
jdbc.unreachable=无法连接到数据库 — 请检查主机、端口和数据库名
jdbc.generic=无法连接到数据库 — 请检查连接信息

# DDL 生成警告
ddl.common-dialect=本文档的 DBMS 尚未注册 SQL 方言，已按通用(逻辑)表示法生成
ddl.empty-table=因没有列而从生成中排除的表: {0}
ddl.table-duplicated=表物理名重复: {0}
ddl.column-duplicated=列物理名重复: {0}.{1}
ddl.key-duplicated=文档内键名重复: {0}
ddl.destructive={0} 个破坏性操作集中在脚本最后一个代码块中 — 执行前请务必检查
ddl.index-skipped=架构读取无法解析索引定义，已从生成中排除 {0} 处索引变更
ddl.autoincrement-unsupported=此 DBMS 的 ALTER 语句无法应用自增变更: {0}
ddl.default-mssql=SQL Server 无法用 ALTER COLUMN 修改默认值 — 请单独管理 DEFAULT 约束: {0}
