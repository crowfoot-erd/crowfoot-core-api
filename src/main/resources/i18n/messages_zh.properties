# 服务器消息 — 简体中文 (api-design.md §5.7)。键集合必须与 messages_ko.properties 一致(MessageParityTest)。

# 通用
error.success=成功
error.invalid_request=请求格式不正确
error.resource_not_found=找不到资源
error.rate_limited=已超出请求限制
error.service_unavailable=服务暂时不可用
error.internal_error=服务器内部发生错误

