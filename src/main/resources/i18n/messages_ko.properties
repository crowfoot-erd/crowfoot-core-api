ddl.column-duplicated=컬럼 물리명이 중복입니다: {0}.{1}
ddl.key-duplicated=키 이름이 문서 내에서 중복입니다: {0}
ddl.destructive=파괴적 연산 {0}건이 스크립트 마지막 블록에 모여 있습니다 — 실행 전 반드시 검토하세요
ddl.index-skipped=스키마 조회가 인덱스 정의를 읽지 못해 인덱스 변경 {0}건을 생성에서 제외했습니다
ddl.autoincrement-unsupported=자동 증가 변경은 이 DBMS의 ALTER 문으로 반영하지 않습니다: {0}
