# 서버 메시지 — 한국어(기본) (api-design.md §5.7) — error.* = ErrorCode, detail.* = 도메인 컨텍스트 문구,
# jdbc.* = 접속 진단, ddl.* = DDL 생성 경고. 다른 언어 파일(en/ja/zh)과 키 집합이 같아야 한다(MessageParityTest).

