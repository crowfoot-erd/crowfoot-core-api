# 운영(k8s) — 시크릿은 전부 환경변수(시크릿 매니저 주입 전제), 기점은 k8s Service DNS.
spring:
  config:
    import: "optional:file:.env-prod[.properties]"    # prod 프로필을 로컬에서 재현할 때만 사용 — k8s 운영은 Secret 환경변수 주입(파일 불필요)
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource   # DBCP2 (local과 동일 풀 정책)
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}                       # 예: jdbc:postgresql://host:port/crowfoot?currentSchema=crowfoot_core
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    dbcp2:
      initial-size: 5
      max-total: 20
      max-idle: 10
      min-idle: 5
      max-wait-millis: 3000
      validation-query: SELECT 1
      test-on-borrow: true
      test-while-idle: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 60000

crowfoot:
  auth:
    # 인증 서버 내부 엔드포인트(블랙리스트 등록) — k8s Service가 80으로 서빙하므로 포트 불필요
    base-url: ${CROWFOOT_AUTH_URI:http://crowfoot-auth}

logging:
  level:
    net.java21.crowfoot: INFO

server:
  port: 8080   # 운영 — 모든 서버 8080
